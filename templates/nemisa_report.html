{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md border-t-4 border-green-600">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">📝 NEMISA Weekly Progress Report</h2>
    <p class="text-gray-600 mb-6">Follow the 3-2-1 Rule: 3 learning sessions, 2 hours practice, 1 report.</p>

    <form method="POST" action="/nemisa/report" class="space-y-6">
        <div class="bg-gray-50 p-4 rounded border">
            <label class="block text-sm font-bold text-gray-700">Participant ID</label>
            <input type="text" name="participant_id" id="pid-input" placeholder="NYS-2026-0001" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-bold text-gray-700">Programme Week</label>
                <input type="number" name="week_number" min="1" max="30" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700">Current NEMISA Progress (%)</label>
                <input type="number" name="progress_pct" min="0" max="100" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div each>
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700">Did you access NEMISA this week?</label>
            <select name="accessed" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                <option>Yes</option>
                <option>No</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700">Did you complete your weekly learning target?</label>
            <select name="target_met" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                <option>Yes</option>
                <option>Partially</option>
                <option>No</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700">What did you learn this week? (Short answer)</label>
            <textarea name="learnings" rows="3" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"></textarea>
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700">What practical activity did you complete?</label>
            <textarea name="practical" rows="3" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"></textarea>
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700">What prevented you from completing your target? (Blockers)</label>
            <textarea name="blockers" rows="2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"></textarea>
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700">What support do you need from facilitators?</label>
            <textarea name="support" rows="2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"></textarea>
        </div>

        <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-green-700 transition shadow-lg">
            Submit Weekly Report →
        </button>
    </form>
</div>

<script>
    const savedPid = localStorage.getItem('nys_participant_id');
    if (savedPid) {
        document.getElementById('pid-input').value = savedPid;
    }
</script>
{% endblock %}
