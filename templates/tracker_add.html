{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6">
        <a href="/employment/tracker" class="text-blue-600 hover:underline text-sm">← Back to Tracker</a>
        <h1 class="text-3xl font-bold text-gray-900 mt-2">➕ Log New Application</h1>
    </div>

    <form method="POST" action="/employment/tracker/add" class="bg-white p-6 rounded-xl shadow-lg space-y-6">
        <input type="hidden" name="participant_id" id="pid-input">
        
        <div>
            <label class="block text-sm font-bold text-gray-700">Select Opportunity</label>
            <select name="opportunity_id" class="w-full p-2 border rounded mt-1">
                <option value="">-- Manual Entry --</option>
                {% for opp in opportunities %}
                <option value="{{ opp.id }}">{{ opp.employer }} - {{ opp.position }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
            <div><label class="block text-sm font-bold text-gray-700">Date Applied</label><input type="date" name="date_applied" class="w-full p-2 border rounded mt-1" required></div>
            <div>
                <label class="block text-sm font-bold text-gray-700">Status</label>
                <select name="status" class="w-full p-2 border rounded mt-1">
                    <option>Preparing</option>
                    <option selected>Submitted</option>
                    <option>Follow-up Due</option>
                    <option>Interview</option>
                    <option>Unsuccessful</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700">Follow-up Date</label>
            <input type="date" name="follow_up_date" class="w-full p-2 border rounded mt-1">
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700">Notes</label>
            <textarea name="notes" rows="3" class="w-full p-2 border rounded mt-1"></textarea>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-blue-700 transition shadow-lg">
            💾 Log Application
        </button>
    </form>
</div>
<script>document.getElementById('pid-input').value = localStorage.getItem('nys_participant_id')?.trim().toUpperCase();</script>
{% endblock %}
