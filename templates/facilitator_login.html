{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md border-t-4 border-yellow-500">
    <div class="text-center mb-6">
        <div class="text-5xl mb-2">👨‍🏫</div>
        <h2 class="text-2xl font-bold text-gray-800">Facilitator Login</h2>
        <p class="text-gray-600 mt-2">Enter your facilitator password to access the admin dashboard</p>
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">
        ❌ {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login/facilitator" class="space-y-4">
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Facilitator Password</label>
            <input type="password" name="password" required 
                   class="w-full rounded-md border-gray-300 shadow-sm p-3 border focus:ring-yellow-500 focus:border-yellow-500">
        </div>
        <button type="submit" class="w-full bg-yellow-500 text-white font-bold py-3 px-4 rounded hover:bg-yellow-600 transition">
            Login as Facilitator →
        </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-600">
        <p>Not a facilitator?</p>
        <a href="/login" class="text-blue-600 font-bold hover:underline">Login as a participant instead</a>
    </div>
</div>
{% endblock %}
