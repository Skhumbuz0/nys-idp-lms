{% extends "base.html" %}
{% block content %}
<div class="max-w-5xl mx-auto">
    <div class="mb-8">
        <h2 class="text-3xl font-bold text-gray-900">Welcome back, <span id="learner-name">Learner</span>!</h2>
        <p class="text-gray-600">Here are your current course enrollments. Click on a course to continue your learning journey.</p>
    </div>

    <div id="loading" class="text-center py-20">
        <p class="text-gray-600">Loading your courses...</p>
    </div>

    <div id="courses-grid" class="grid md:grid-cols-2 gap-6 hidden">
        <!-- Populated by JS -->
    </div>
</div>

<script>
    // Trim whitespace to prevent "undefined" or "NYS-2026-0001 " errors
    const rawPid = localStorage.getItem('nys_participant_id');
    const pid = rawPid ? rawPid.trim() : null;
    const rawName = localStorage.getItem('nys_participant_name');
    const name = rawName ? rawName.trim() : 'Learner';
    
    if (!pid || pid === 'null' || pid === 'undefined') {
        window.location.href = '/login';
    } else {
        document.getElementById('learner-name').textContent = name;
        
        fetch(`/api/learner-dashboard/${pid}`)
            .then(async r => {
                if (!r.ok) {
                    const errorText = await r.text();
                    throw new Error(`Server returned ${r.status}: ${errorText}`);
                }
                return r.json();
            })
            .then(data => {
                document.getElementById('loading').classList.add('hidden');
                const grid = document.getElementById('courses-grid');
                grid.classList.remove('hidden');
                
                // Safely check if courses exist
                const courses = data.courses || [];
                if (courses.length === 0) {
                    grid.innerHTML = '<p class="text-gray-600 col-span-2 text-center">No courses enrolled yet. Please contact your facilitator.</p>';
                    return;
                }

                courses.forEach(course => {
                    // Define colors and routes for each course
                    let colorClass, btnColor, barColor, route;
                    
                    if (course.code === 'NYS-IDP') {
                        colorClass = 'border-purple-500';
                        btnColor = 'bg-purple-600 hover:bg-purple-700';
                        barColor = 'bg-purple-600';
                        route = '/my-progress';
                    } else if (course.code === 'NEMISA-DIGITAL') {
                        colorClass = 'border-green-500';
                        btnColor = 'bg-green-600 hover:bg-green-700';
                        barColor = 'bg-green-600';
                        route = '/nemisa';

                    } else if (course.code === 'MAYO-AI') {
                        colorClass = 'border-indigo-500';
                        btnColor = 'bg-indigo-600 hover:bg-indigo-700';
                        barColor = 'bg-indigo-600';
                        route = '/ai-fluency';
                    
                    } else if (course.code === 'MAYO-L2L') {
                        colorClass = 'border-orange-500';
                        btnColor = 'bg-orange-600 hover:bg-orange-700';
                        barColor = 'bg-orange-600';
                        route = '/learning-to-learn';    
                    
                    } else {
                        // Fallback for any future courses
                        colorClass = 'border-gray-500';
                        btnColor = 'bg-gray-600 hover:bg-gray-700';
                        barColor = 'bg-gray-600';
                        route = '/learner-dashboard';
                    }

                    
                    
                    const card = `
                        <div class="bg-white rounded-xl shadow-md border-t-4 ${colorClass} p-6 flex flex-col justify-between">
                            <div>
                                <h3 class="text-xl font-bold text-gray-900 mb-2">${course.title}</h3>
                                <p class="text-gray-600 mb-4 text-sm">${course.description}</p>
                                <div class="mb-4">
                                    <div class="flex justify-between text-sm font-semibold mb-1">
                                        <span>Progress</span>
                                        <span>${course.progress}%</span>
                                    </div>
                                    <div class="w-full bg-gray-200 rounded-full h-3">
                                        <div class="${barColor} h-3 rounded-full transition-all duration-500" style="width: ${course.progress}%"></div>
                                    </div>
                                </div>
                            </div>
                            <a href="${route}" class="block w-full text-center ${btnColor} text-white font-bold py-3 px-4 rounded-lg transition shadow">
                                Continue Learning →
                            </a>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            })
            .catch(err => {
                console.error("Dashboard fetch error:", err);
                document.getElementById('loading').innerHTML = `<p class="text-red-600">Error: ${err.message}. Please <a href="/login" class="underline font-bold">login again</a>.</p>`;
            });
    }
</script>
{% endblock %}
