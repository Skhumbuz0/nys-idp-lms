{% extends "base.html" %}
{% block content %}
<div class="max-w-5xl mx-auto">
    <div class="mb-8">
        <h2 class="text-3xl font-bold text-gray-900">Welcome back, <span id="learner-name">Learner</span>!</h2>
        <p class="text-gray-600">Here are your current course enrollments. Click on a course to continue your learning journey.</p>
    </div>

    <div id="loading" class="text-center py-20">
        <p class="text-gray-600">Loading your courses...</p>
    </div>

    <div id="courses-grid" class="grid md:grid-cols-2 gap-6 hidden">
        <!-- Populated by JS -->
    </div>
</div>

<script>
    const pid = localStorage.getItem('nys_participant_id');
    const name = localStorage.getItem('nys_participant_name');
    
    if (!pid) {
        window.location.href = '/login';
    } else {
        document.getElementById('learner-name').textContent = name || 'Learner';
        
        fetch(`/api/learner-dashboard/${pid}`)
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(data => {
                document.getElementById('loading').classList.add('hidden');
                const grid = document.getElementById('courses-grid');
                grid.classList.remove('hidden');
                
                data.courses.forEach(course => {
                    let colorClass = course.code === 'NYS-IDP' ? 'border-purple-500' : 'border-green-500';
                    let btnColor = course.code === 'NYS-IDP' ? 'bg-purple-600 hover:bg-purple-700' : 'bg-green-600 hover:bg-green-700';
                    let route = course.code === 'NYS-IDP' ? '/my-progress' : '/nemisa';
                    
                    const card = `
                        <div class="bg-white rounded-xl shadow-md border-t-4 ${colorClass} p-6 flex flex-col justify-between">
                            <div>
                                <h3 class="text-xl font-bold text-gray-900 mb-2">${course.title}</h3>
                                <p class="text-gray-600 mb-4 text-sm">${course.description}</p>
                                <div class="mb-4">
                                    <div class="flex justify-between text-sm font-semibold mb-1">
                                        <span>Progress</span>
                                        <span>${course.progress}%</span>
                                    </div>
                                    <div class="w-full bg-gray-200 rounded-full h-3">
                                        <div class="${course.code === 'NYS-IDP' ? 'bg-purple-600' : 'bg-green-600'} h-3 rounded-full transition-all duration-500" style="width: ${course.progress}%"></div>
                                    </div>
                                </div>
                            </div>
                            <a href="${route}" class="block w-full text-center ${btnColor} text-white font-bold py-3 px-4 rounded-lg transition shadow">
                                Continue Learning →
                            </a>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            })
            .catch(() => {
                document.getElementById('loading').innerHTML = '<p class="text-red-600">Error loading courses. Please <a href="/login" class="underline">login again</a>.</p>';
            });
    }
</script>
{% endblock %}
