{% extends "base.html" %}
{% block content %}
<div class="max-w-5xl mx-auto">
    <div class="mb-8">
        <h2 class="text-3xl font-bold text-gray-900">MAYO Employment Readiness</h2>
        <p class="text-gray-600 mt-2">Build Your CV. Apply With Confidence. Track Your Progress. Get Ready for Work.</p>
    </div>
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        {% for m in modules %}
        <a href="/employment/module/{{ m.code }}" class="block bg-white p-6 rounded-xl shadow-md border-l-4 border-blue-500 hover:shadow-lg transition">
            <span class="text-4xl mb-3 block">{{ m.icon }}</span>
            <h3 class="font-bold text-gray-900 text-lg">{{ m.title }}</h3>
            <p class="text-sm text-blue-600 mt-2 font-semibold">Start Module →</p>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
