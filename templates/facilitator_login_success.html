{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md text-center border-t-4 border-yellow-500">
    <div class="text-5xl mb-4">✅</div>
    <h2 class="text-2xl font-bold text-yellow-600 mb-2">Facilitator Access Granted</h2>
    <p class="text-gray-600 mb-6">Welcome to the Facilitator Dashboard</p>
    
    <a href="/facilitator" class="block w-full bg-yellow-500 text-white font-bold py-3 px-8 rounded-lg hover:bg-yellow-600 transition shadow-lg" onclick="saveFacilitator()">
        Open Facilitator Dashboard →
    </a>
</div>

<script>
    localStorage.setItem('nys_role', 'facilitator');
    localStorage.removeItem('nys_participant_id');
    localStorage.removeItem('nys_participant_name');
    setTimeout(() => { window.location.href = "/facilitator"; }, 1500);
</script>
{% endblock %}
