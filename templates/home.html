{% extends "base.html" %}
{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4">
    <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4">MAYO Learner Management System</h1>
    <p class="text-xl text-gray-600 mb-8 max-w-2xl">Empowering your personal and professional growth through structured learning, daily action, and digital skills mastery.</p>
    
    <!-- Shows only if NOT logged in -->
    <div id="guest-actions" class="flex flex-col sm:flex-row gap-4">
        <a href="/login" class="bg-blue-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700 transition shadow-lg text-lg">
            🔑 Login to Your Account
        </a>
        <a href="/register" class="bg-white text-blue-600 border-2 border-blue-600 font-bold py-3 px-8 rounded-lg hover:bg-blue-50 transition shadow-lg text-lg">
            📝 New Participant Registration
        </a>
    </div>

    <!-- Shows only if logged in -->
    <div id="learner-actions" class="hidden">
        <a href="/learner-dashboard" class="bg-indigo-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-indigo-700 transition shadow-lg text-lg">
            📚 Go to My Courses
        </a>
    </div>
</div>

<script>
    // Hide guest actions and show learner actions if logged in
    if (localStorage.getItem('nys_participant_id')) {
        document.getElementById('guest-actions').classList.add('hidden');
        document.getElementById('learner-actions').classList.remove('hidden');
    }
</script>
{% endblock %}
