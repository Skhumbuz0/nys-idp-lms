{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md border-t-4 border-blue-500">
    <div class="text-center mb-6">
        <div class="text-5xl mb-2">🔑</div>
        <h2 class="text-2xl font-bold text-gray-800">Participant Login</h2>
        <p class="text-gray-600 mt-2">Enter your Participant ID to access your progress</p>
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">
        ❌ {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Participant ID</label>
            <input type="text" name="participant_id" placeholder="NYS-2026-0001" required 
                   class="w-full rounded-md border-gray-300 shadow-sm p-3 border text-center font-mono text-lg focus:ring-blue-500 focus:border-blue-500">
            <p class="text-xs text-gray-500 mt-1">Format: NYS-2026-XXXX</p>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded hover:bg-blue-700 transition">
            Login →
        </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-600">
        <p>Don't have an ID yet?</p>
        <a href="/register" class="text-blue-600 font-bold hover:underline">Register here</a>
    </div>
</div>
{% endblock %}
