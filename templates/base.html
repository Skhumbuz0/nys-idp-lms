<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYS IDP LMS - MAYO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">
    
    <!-- Navigation Bar -->
    <nav class="bg-gray-900 text-white p-4 shadow-md">
        <div class="container mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            
            <!-- MAYO Logo & App Name Section -->
            <div class="flex items-center gap-3">
                <!-- ⚠️ IMPORTANT: Replace the 'src' URL below with your actual MAYO logo image URL -->
                <img src="https://imgur.com/a/kX42tbQ" 
                     alt="MAYO Logo" 
                     class="h-10 w-auto bg-white rounded p-1 shadow-sm">
                
                <!-- Vertical Divider (hidden on mobile) -->
                <div class="h-8 w-px bg-gray-600 hidden sm:block"></div>
                
                <h1 class="text-lg font-bold text-gray-100">NYS IDP — Think & Grow Rich</h1>
            </div>
            
            <!-- Navigation Links -->
            <div class="flex space-x-4 text-sm sm:text-base">
                <a href="/" class="hover:text-blue-300 transition">Home</a>
                <a href="/register" class="hover:text-blue-300 transition">Register</a>
                <a href="/daily-action" class="hover:text-blue-300 transition">Daily Action</a>
                <a href="/dashboard" class="hover:text-yellow-400 font-semibold transition">Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="container mx-auto p-6 flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 text-center p-4 text-sm mt-auto border-t border-gray-800">
        <p>&copy; 2026 MAYO. All rights reserved. | NYS IDP Learning Management System</p>
    </footer>

</body>
</html>
